<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Enigmus Blog feed</title>
    <!-- /feed is a hand-typed guess for the feed address. GitHub Pages cannot
         issue redirects, so this stub forwards to the real feed. -->
    <meta http-equiv="refresh" content="0; url=/feed.xml" />
    <link rel="canonical" href="https://enigmus.cc/feed.xml" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Enigmus Blog"
      href="https://enigmus.cc/feed.xml"
    />
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <p>The Enigmus blog feed is at <a href="/feed.xml">/feed.xml</a>.</p>
  </body>
</html>
