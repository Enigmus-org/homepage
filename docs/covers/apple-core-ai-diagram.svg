<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5BBFFA"/>
      <stop offset="0.55" stop-color="#1F8FE8"/>
      <stop offset="1" stop-color="#0B62C4"/>
    </linearGradient>
    <radialGradient id="auroraV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6D5EF5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6D5EF5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraT" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14C7C7" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#14C7C7" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#062B52" flood-opacity="0.28"/>
    </filter>
    <filter id="pillShadow" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#04203D" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="150" cy="600" rx="520" ry="330" fill="url(#auroraV)"/>
  <ellipse cx="1090" cy="40" rx="460" ry="300" fill="url(#auroraT)"/>

  <text x="72" y="92" font-family="Helvetica Neue, Helvetica, Arial" font-size="46" font-weight="700" fill="#FFFFFF">One API, three engines</text>
  <text x="72" y="128" font-family="Helvetica Neue, Helvetica, Arial" font-size="19" fill="#FFFFFF" fill-opacity="0.82">Apple&#8217;s Foundation Models protocols make the inference engine a swappable backend</text>

  <g filter="url(#pillShadow)">
    <rect x="330" y="172" width="540" height="66" rx="16" fill="#0B1220"/>
    <rect x="330" y="172" width="540" height="66" rx="16" fill="none" stroke="#5EC0FF" stroke-opacity="0.45" stroke-width="1.5"/>
  </g>
  <text x="600" y="213" text-anchor="middle" font-family="Menlo, monospace" font-size="23" fill="#E8ECF5">LanguageModelSession</text>

  <g stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2" fill="none">
    <path d="M600 238 V 276"/>
    <path d="M212 276 H 988"/>
    <path d="M212 276 V 330"/>
    <path d="M600 276 V 330"/>
    <path d="M988 276 V 330"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.8">
    <circle cx="212" cy="330" r="4"/>
    <circle cx="600" cy="330" r="4"/>
    <circle cx="988" cy="330" r="4"/>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="72" y="338" width="280" height="168" rx="20" fill="#FFFFFF" fill-opacity="0.96"/>
    <rect x="460" y="338" width="280" height="168" rx="20" fill="#FFFFFF"/>
    <rect x="848" y="338" width="280" height="168" rx="20" fill="#FFFFFF" fill-opacity="0.96"/>
  </g>
  <rect x="460" y="338" width="280" height="168" rx="20" fill="none" stroke="#1FA3FB" stroke-width="3"/>

  <text x="100" y="382" font-family="Helvetica Neue, Helvetica, Arial" font-size="21" font-weight="600" fill="#0C1220">Apple system model</text>
  <text x="100" y="414" font-family="Helvetica Neue, Helvetica, Arial" font-size="15" fill="#46506A">Built in, nothing to download</text>
  <text x="100" y="440" font-family="Helvetica Neue, Helvetica, Arial" font-size="15" fill="#46506A">Private Cloud Compute variant</text>
  <text x="100" y="480" font-family="Menlo, monospace" font-size="13" fill="#0D6FD1">shipped &#183; OS 26+</text>

  <text x="488" y="382" font-family="Helvetica Neue, Helvetica, Arial" font-size="21" font-weight="600" fill="#0C1220">Core AI bundle</text>
  <text x="488" y="414" font-family="Helvetica Neue, Helvetica, Arial" font-size="15" fill="#46506A">GPU pipelined engine</text>
  <text x="488" y="440" font-family="Helvetica Neue, Helvetica, Arial" font-size="15" fill="#46506A">ANE static-shape engine</text>
  <text x="488" y="480" font-family="Menlo, monospace" font-size="13" fill="#0D6FD1">.aimodel &#183; OS 27 beta</text>

  <text x="876" y="382" font-family="Helvetica Neue, Helvetica, Arial" font-size="21" font-weight="600" fill="#0C1220">MLX checkpoint</text>
  <text x="876" y="414" font-family="Helvetica Neue, Helvetica, Arial" font-size="15" fill="#46506A">Any Hugging Face model</text>
  <text x="876" y="440" font-family="Helvetica Neue, Helvetica, Arial" font-size="15" fill="#46506A">via MLXFoundationModels</text>
  <text x="876" y="480" font-family="Menlo, monospace" font-size="13" fill="#0D6FD1">safetensors &#183; OS 27 beta</text>

  <text x="72" y="566" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" fill="#FFFFFF" fill-opacity="0.78">Enigmus runs on MLX today. The seam above is what a transition to Core AI would use.</text>
</svg>
