<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5BBFFA"/>
      <stop offset="0.55" stop-color="#1F8FE8"/>
      <stop offset="1" stop-color="#0B62C4"/>
    </linearGradient>
    <radialGradient id="auroraV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6D5EF5" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6D5EF5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraT" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14C7C7" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#14C7C7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2436"/>
      <stop offset="1" stop-color="#141C2B"/>
    </linearGradient>
    <filter id="winShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#03203C" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="120" cy="620" rx="520" ry="320" fill="url(#auroraV)"/>
  <ellipse cx="1110" cy="30" rx="440" ry="280" fill="url(#auroraT)"/>

  <text x="90" y="80" font-family="Helvetica Neue, Helvetica, Arial" font-size="42" font-weight="700" fill="#FFFFFF">A coding agent on a local 9B model</text>

  <g filter="url(#winShadow)">
    <rect x="90" y="112" width="1020" height="432" rx="16" fill="#0B1220"/>
  </g>
  <path d="M90 128 a16 16 0 0 1 16-16 h988 a16 16 0 0 1 16 16 v30 H90 Z" fill="url(#titlebar)"/>
  <rect x="90" y="112" width="1020" height="432" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
  <circle cx="118" cy="135" r="6.5" fill="#FF5F57"/>
  <circle cx="140" cy="135" r="6.5" fill="#FEBC2E"/>
  <circle cx="162" cy="135" r="6.5" fill="#28C840"/>
  <text x="600" y="140" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial" font-size="14" fill="#6B7488">pi - Enigmus LLM Server</text>

  <g font-family="Menlo, monospace" font-size="17" xml:space="preserve">
    <text x="120" y="196" fill="#6B7488"># Enigmus serves Qwen 3.5 9B on 127.0.0.1:31415</text>
    <text x="120" y="226"><tspan fill="#5FCB7F">$ </tspan><tspan fill="#E8ECF5">pi -p </tspan><tspan fill="#9FE0FF">--model</tspan><tspan fill="#E8ECF5"> enigmus/mlx-community/Qwen3.5-9B-4bit \</tspan></text>
    <text x="164" y="256" fill="#E8ECF5">"test_calc.py fails. Fix the bug in calc.py and run the test."</text>

    <text x="120" y="316" fill="#E8ECF5">Fixed! The bug was in `calc.py` - it was dividing by `(len(xs) + 1)`</text>
    <text x="120" y="346" fill="#E8ECF5">instead of just `len(xs)`. I corrected the formula and ran the test,</text>
    <text x="120" y="376" fill="#E8ECF5">which now passes.</text>

    <text x="120" y="436" fill="#5FCB7F">$</text>
  </g>
  <rect x="142" y="420" width="10" height="20" fill="#5EC0FF"/>

  <text x="90" y="590" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" fill="#FFFFFF" fill-opacity="0.8">1,599-token first request - M1 Pro, 16 GB - served on 127.0.0.1</text>
</svg>
