<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5BBFFA"/>
      <stop offset="0.55" stop-color="#1F8FE8"/>
      <stop offset="1" stop-color="#0B62C4"/>
    </linearGradient>
    <radialGradient id="auroraV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6D5EF5" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6D5EF5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraT" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14C7C7" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#14C7C7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2436"/>
      <stop offset="1" stop-color="#141C2B"/>
    </linearGradient>
    <filter id="winShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#03203C" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="120" cy="620" rx="520" ry="320" fill="url(#auroraV)"/>
  <ellipse cx="1110" cy="30" rx="440" ry="280" fill="url(#auroraT)"/>

  <text x="90" y="80" font-family="Helvetica Neue, Helvetica, Arial" font-size="42" font-weight="700" fill="#FFFFFF">A local LLM in three commands</text>

  <g filter="url(#winShadow)">
    <rect x="90" y="112" width="1020" height="432" rx="16" fill="#0B1220"/>
  </g>
  <path d="M90 128 a16 16 0 0 1 16-16 h988 a16 16 0 0 1 16 16 v30 H90 Z" fill="url(#titlebar)"/>
  <rect x="90" y="112" width="1020" height="432" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
  <circle cx="118" cy="135" r="6.5" fill="#FF5F57"/>
  <circle cx="140" cy="135" r="6.5" fill="#FEBC2E"/>
  <circle cx="162" cy="135" r="6.5" fill="#28C840"/>
  <text x="600" y="140" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial" font-size="14" fill="#6B7488">llm-runner &#8212; Core AI</text>

  <g font-family="Menlo, monospace" font-size="17" xml:space="preserve">
    <text x="120" y="196" fill="#6B7488"># export a checkpoint &#8212; runs on the dev machine</text>
    <text x="120" y="226"><tspan fill="#5FCB7F">$ </tspan><tspan fill="#E8ECF5">uv run coreai.llm.export Qwen/Qwen3-0.6B</tspan></text>
    <text x="120" y="256"><tspan fill="#5FCB7F">$ </tspan><tspan fill="#E8ECF5">uv run coreai.llm.export Qwen/Qwen3-0.6B </tspan><tspan fill="#9FE0FF">--platform iOS</tspan></text>

    <text x="120" y="316" fill="#6B7488"># run it &#8212; no app bundle, no network</text>
    <text x="120" y="346"><tspan fill="#5FCB7F">$ </tspan><tspan fill="#E8ECF5">swift run -c release llm-runner \</tspan></text>
    <text x="164" y="376"><tspan fill="#9FE0FF">--model</tspan><tspan fill="#E8ECF5"> Qwen3-0.6B.aimodel \</tspan></text>
    <text x="164" y="406"><tspan fill="#9FE0FF">--prompt</tspan><tspan fill="#E8ECF5"> "Explain a one-time pad."</tspan></text>

    <text x="120" y="466" fill="#6B7488"># measure it before betting on it</text>
    <text x="120" y="496"><tspan fill="#5FCB7F">$ </tspan><tspan fill="#E8ECF5">swift run -c release llm-benchmark </tspan><tspan fill="#9FE0FF">--model</tspan><tspan fill="#E8ECF5"> Qwen3-0.6B.aimodel</tspan><tspan fill="#5EC0FF"> &#9613;</tspan></text>
  </g>

  <text x="90" y="590" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" fill="#FFFFFF" fill-opacity="0.8">Core AI ships LLM inference as command-line executables &#183; requires iOS / macOS 27</text>
</svg>
